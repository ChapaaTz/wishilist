  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

:rgba(52,213,167,.32);\n\n  /* accents */\n  --amber:#f3a712;\n  --rose:#ff6b6b;\n  --plum:#a78bfa;\n  --sky:#67c8ff;\n\n  --shadow:0 1px 2px rgba(0,0,0,.4), 0 18px 40px -20px rgba(0,0,0,.65);\n  --shadow-lg:0 30px 60px -24px rgba(0,0,0,.7);\n  --shadow-mint:0 18px 40px -16px rgba(52,213,167,.45);\n\n  --sans:'Sora','Helvetica Neue',-apple-system,system-ui,sans-serif;\n  --mono:'Google Sans Code',ui-monospace,'SF Mono',Menlo,monospace;\n}\n*{box-sizing:border-box;margin:0;padding:0;}\nhtml{scroll-behavior:smooth;}\nbody{\n  font-family:var(--sans);font-weight:400;\n  color:var(--text);\n  background:\n    radial-gradient(1100px 600px at 90% -8%, rgba(52,213,167,.10), transparent 60%),\n    radial-gradient(900px 500px at -10% 8%, rgba(103,200,255,.06), transparent 55%),\n    var(--page-bg);\n  line-height:1.55;letter-spacing:-.005em;\n  -webkit-font-smoothing:antialiased;\n}\n.wrap{max-width:1200px;margin:0 auto;padding:0 28px;}\n.doc{padding:40px 0 120px;}\n\n/* ---------- topbar ---------- */\n.topbar{\n  position:sticky;top:0;z-index:50;\n  background:rgba(10,18,32,.78);\n  backdrop-filter:saturate(160%) blur(14px);\n  border-bottom:1px solid var(--page-line);\n}\n.topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;}\n.brand{display:flex;align-items:center;gap:11px;font-weight:700;letter-spacing:-.015em;}\n.brand .logo{\n  width:32px;height:32px;border-radius:10px;\n  background:linear-gradient(135deg,var(--mint),#16b9c4);\n  display:grid;place-items:center;color:var(--mint-ink);font-weight:800;font-size:15px;\n  box-shadow:0 6px 16px -6px rgba(52,213,167,.7);\n}\n.brand small{font-weight:400;color:var(--text-3);font-size:13px;}\n.topbar .meta{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.04em;}\n\n/* ---------- hero ---------- */\n.hero{\n  background:linear-gradient(160deg,#0e1a32 0%,#0b1426 55%,#091228 100%);\n  border:1px solid var(--page-line);\n  color:var(--text);border-radius:28px;padding:54px 50px 50px;\n  position:relative;overflow:hidden;box-shadow:var(--shadow-lg);margin-top:8px;\n}\n.hero::after{\n  content:\"\";position:absolute;right:-100px;top:-130px;\n  width:480px;height:480px;border-radius:50%;\n  background:radial-gradient(circle at 30% 30%, rgba(52,213,167,.55), transparent 60%);\n  filter:blur(10px);opacity:.55;\n}\n.hero::before{\n  content:\"\";position:absolute;left:-80px;bottom:-160px;\n  width:380px;height:380px;border-radius:50%;\n  background:radial-gradient(circle at 40% 40%, rgba(103,200,255,.30), transparent 60%);\n  filter:blur(8px);opacity:.5;\n}\n.pill{\n  display:inline-flex;align-items:center;gap:8px;\n  font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;\n  color:#bff0db;background:rgba(52,213,167,.12);border:1px solid var(--mint-border);\n  padding:6px 12px;border-radius:999px;position:relative;z-index:2;\n}\n.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 4px rgba(52,213,167,.25);}\n.hero h1{\n  font-size:clamp(36px,4.8vw,56px);line-height:1.02;letter-spacing:-.028em;\n  margin:24px 0 14px;font-weight:700;position:relative;z-index:2;\n}\n.hero h1 .accent{\n  background:linear-gradient(100deg,var(--mint),#67c8ff);\n  -webkit-background-clip:text;background-clip:text;color:transparent;\n}\n.hero p{max-width:660px;color:var(--text-2);font-size:16px;position:relative;z-index:2;font-weight:300;}\n.hero-meta{display:flex;flex-wrap:wrap;gap:34px;margin-top:34px;position:relative;z-index:2;}\n.hero-meta .k{color:#8e98b8;font-family:var(--mono);letter-spacing:.04em;font-size:11px;text-transform:uppercase;}\n.hero-meta .v{color:#fff;font-weight:600;font-size:15px;margin-top:4px;}\n\n/* ---------- sections ---------- */\nsection{margin-top:88px;scroll-margin-top:80px;}\n.sec-head{display:flex;align-items:baseline;gap:14px;margin-bottom:10px;}\n.sec-num{\n  font-family:var(--mono);font-size:12.5px;color:var(--mint);\n  border:1px solid var(--page-line-2);background:var(--page-bg-2);padding:3px 9px;border-radius:8px;font-weight:600;\n}\nh2{font-size:30px;letter-spacing:-.025em;font-weight:700;}\n.lead{color:var(--text-2);font-size:16px;max-width:780px;margin:10px 0 32px;font-weight:300;}\n\n/* ---------- phone ---------- */\n.stage{display:flex;gap:38px;align-items:flex-start;flex-wrap:wrap;}\n.stage.center{justify-content:center;}\n.col-notes{flex:1;min-width:260px;max-width:380px;padding-top:8px;}\n.phone{\n  width:330px;background:#000;border-radius:46px;padding:11px;\n  box-shadow:var(--shadow-lg);flex-shrink:0;position:relative;\n  border:1px solid #1c2540;\n}\n.phone .screen{\n  background:var(--screen);\n  border-radius:36px;overflow:hidden;position:relative;\n  min-height:700px;display:flex;flex-direction:column;\n  color:var(--text);\n}\n/* dynamic island */\n.island{position:absolute;top:8px;left:50%;transform:translateX(-50%);\n  width:110px;height:30px;border-radius:18px;background:#000;z-index:5;}\n\n.sb{display:flex;align-items:center;justify-content:space-between;padding:14px 28px 4px;font-size:14px;font-weight:600;color:#fff;}\n.sb .right{display:flex;align-items:center;gap:6px;}\n.sb .sig{width:17px;height:11px;background:\n  linear-gradient(to right,#fff 0 3px,transparent 3px 4px,#fff 4px 7px,transparent 7px 8px,#fff 8px 11px,transparent 11px 12px,#fff 12px 16px);}\n.sb .wifi{width:15px;height:11px;border-radius:2px;background:#fff;clip-path:polygon(0 60%,100% 60%,80% 0,20% 0);}\n.sb .bat{width:26px;height:12px;border:1.4px solid #fff;border-radius:3px;position:relative;padding:1.5px;}\n.sb .bat::after{content:\"\";position:absolute;right:-3px;top:3.5px;width:2px;height:5px;background:#fff;border-radius:0 2px 2px 0;}\n.sb .bat span{display:block;height:100%;width:78%;background:#fff;border-radius:1px;}\n\n.home-ind{height:5px;width:130px;background:#fff;border-radius:3px;margin:6px auto 8px;opacity:.95;}\n\n/* ---------- in-screen ---------- */\n.appbar{display:flex;align-items:flex-start;justify-content:space-between;padding:14px 22px 14px;}\n.appbar .greet{font-size:12.5px;color:var(--text-3);font-weight:400;letter-spacing:-.005em;}\n.appbar .name{font-size:30px;font-weight:700;letter-spacing:-.025em;color:#fff;display:flex;align-items:center;gap:6px;margin-top:2px;}\n.appbar .ttl{font-size:28px;font-weight:700;letter-spacing:-.025em;color:#fff;}\n.appbar .sub-lbl{font-size:11px;font-family:var(--mono);color:var(--text-3);letter-spacing:.06em;text-transform:uppercase;}\n.appbar .ctrls{display:flex;align-items:center;gap:10px;margin-top:6px;}\n.icon-btn{width:42px;height:42px;border-radius:14px;background:var(--glass);border:1px solid var(--line);display:grid;place-items:center;font-size:16px;color:#fff;position:relative;}\n.icon-btn .dot-r{position:absolute;top:9px;right:9px;width:6px;height:6px;border-radius:50%;background:var(--rose);}\n.avatar{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--mint),#16b9c4);color:var(--mint-ink);display:grid;place-items:center;font-weight:800;font-size:14px;}\n\n/* search bar (dark) */\n.search{margin:0 22px;display:flex;align-items:center;gap:10px;background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:13px 16px;}\n.search .mag{color:var(--text-3);font-size:14px;}\n.search .ph{color:var(--text-3);font-size:13.5px;flex:1;font-weight:400;}\n.search .scan{color:var(--mint);font-size:14px;}\n\n/* category chips */\n.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 22px 4px;}\n.chip{flex-shrink:0;padding:9px 15px;border-radius:999px;font-size:12.5px;font-weight:500;border:1px solid var(--line);background:var(--glass);color:var(--text-2);display:inline-flex;align-items:center;gap:6px;}\n.chip.on{background:var(--mint);color:var(--mint-ink);border-color:var(--mint);font-weight:700;}\n\n/* row head */\n.row-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 12px;}\n.row-head .t{font-size:16px;font-weight:600;color:#fff;letter-spacing:-.01em;}\n.row-head .a{font-size:12px;color:var(--mint);font-weight:500;}\n\n/* ---------- featured mint card (THE signature pattern) ---------- */\n.mint-feat{\n  margin:6px 22px 0;\n  background:linear-gradient(150deg,#3edcae 0%,#34d5a7 65%,#26c397 100%);\n  border-radius:22px;padding:20px 20px 16px;\n  position:relative;overflow:hidden;color:var(--mint-ink);\n  box-shadow:var(--shadow-mint);\n}\n.mint-feat::after{\n  content:\"\";position:absolute;right:-50px;top:-50px;\n  width:180px;height:180px;border-radius:50%;\n  background:rgba(255,255,255,.15);\n}\n.mint-feat::before{\n  content:\"\";position:absolute;right:-90px;bottom:-90px;\n  width:230px;height:230px;border-radius:50%;\n  background:rgba(255,255,255,.08);\n}\n.mf-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2;}\n.mf-pill{display:inline-flex;align-items:center;gap:7px;background:rgba(10,40,28,.35);color:#062a1e;font-family:var(--mono);font-size:11px;font-weight:600;padding:6px 11px;border-radius:999px;letter-spacing:.06em;}\n.mf-pill .d{width:6px;height:6px;border-radius:50%;background:var(--rose);box-shadow:0 0 0 3px rgba(255,107,107,.3);}\n.mf-fav{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.65);display:grid;place-items:center;color:var(--mint-ink);font-size:15px;backdrop-filter:blur(4px);}\n\n.mf-title{font-size:42px;font-weight:700;letter-spacing:-.03em;margin-top:18px;line-height:1;position:relative;z-index:2;}\n.mf-sub{font-size:13.5px;font-weight:500;margin-top:8px;position:relative;z-index:2;color:#073527;}\n.mf-desc{font-size:13px;margin-top:18px;line-height:1.5;font-weight:400;position:relative;z-index:2;color:#0a3e2d;max-width:90%;}\n\n.mf-progress{\n  margin-top:18px;background:rgba(255,255,255,.5);border-radius:14px;padding:12px 14px;\n  position:relative;z-index:2;backdrop-filter:blur(4px);\n}\n.mf-progress .row1{display:flex;align-items:flex-end;justify-content:space-between;}\n.mf-progress .raised .v{font-size:18px;font-weight:700;color:var(--mint-ink);letter-spacing:-.02em;}\n.mf-progress .raised .v .cur{font-size:10px;font-family:var(--mono);color:#0a3e2d;margin-left:3px;font-weight:500;}\n.mf-progress .raised .s{font-size:11px;color:#0a3e2d;font-weight:400;margin-top:1px;}\n.mf-progress .pct{background:#fff;color:var(--mint-ink);font-size:13px;font-weight:700;padding:5px 11px;border-radius:999px;}\n.mf-bar{margin-top:9px;height:4px;background:rgba(10,40,28,.18);border-radius:2px;overflow:hidden;}\n.mf-bar .fill{height:100%;background:var(--mint-ink);border-radius:2px;width:43%;}\n.mf-foot{display:flex;align-items:center;justify-content:space-between;margin-top:11px;}\n.mf-foot .left{display:flex;align-items:center;gap:8px;}\n.mf-foot .stack{display:flex;align-items:center;}\n.mf-foot .stack .av{width:22px;height:22px;border-radius:50%;border:2px solid #4dddb0;margin-left:-7px;font-size:9.5px;font-weight:700;display:grid;place-items:center;color:#fff;}\n.mf-foot .stack .av:first-child{margin-left:0;}\n.mf-foot .a1{background:#f3a712;}\n.mf-foot .a2{background:#67c8ff;}\n.mf-foot .a3{background:#a78bfa;}\n.mf-foot .a4{background:#0a3e2d;color:#fff;font-size:8.5px;}\n.mf-foot .donors{font-size:11.5px;color:var(--mint-ink);font-weight:500;}\n.mf-foot .cta{font-size:12.5px;font-weight:600;color:var(--mint-ink);display:inline-flex;align-items:center;gap:4px;}\n\n/* attendees badge generic */\n.attendees{display:flex;align-items:center;}\n.attendees .av{width:22px;height:22px;border-radius:50%;border:2px solid var(--screen);margin-left:-7px;background:linear-gradient(135deg,#5fd6a6,#34b886);}\n.attendees .av:first-child{margin-left:0;}\n.attendees .av:nth-child(2){background:linear-gradient(135deg,#16b9c4,#0d8e98);}\n.attendees .av:nth-child(3){background:linear-gradient(135deg,#f3a712,#e08600);}\n.attendees .more{font-size:10.5px;color:var(--text-3);margin-left:8px;font-family:var(--mono);}\n\n/* quick action grid */\n.qa-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:16px 22px 0;}\n.qa-cell{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:16px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;}\n.qa-cell .ic{width:34px;height:34px;border-radius:11px;background:var(--mint-soft);color:var(--mint);display:grid;place-items:center;font-size:15px;font-weight:800;}\n.qa-cell .l{font-size:11.5px;color:#fff;font-weight:500;}\n\n/* cover placeholders (dark theme) */\n.cover{\n  position:relative;border-radius:16px;overflow:hidden;color:#fff;\n  background:linear-gradient(135deg,#1e2b48,#0d8e98 110%);\n}\n.cover.mint{background:linear-gradient(135deg,#3edcae,#1fb48a);color:var(--mint-ink);}\n.cover.warm{background:linear-gradient(135deg,#f3a712,#ff6b6b);}\n.cover.plum{background:linear-gradient(135deg,#a78bfa,#67c8ff);}\n.cover.navy{background:linear-gradient(160deg,#1a2245,#0d3a5f);}\n.cover .ph-label{\n  position:absolute;top:9px;left:11px;\n  font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;\n  color:rgba(255,255,255,.65);background:rgba(0,0,0,.32);padding:3px 7px;border-radius:5px;\n  backdrop-filter:blur(4px);\n}\n.cover .ph-emoji{position:absolute;right:14px;bottom:12px;font-size:32px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4));}\n.cover .glow{position:absolute;inset:0;background:radial-gradient(circle at 75% 85%,rgba(255,255,255,.18),transparent 60%);}\n\n/* horizontal event rail (dark) */\n.h-row{display:flex;gap:12px;overflow-x:auto;padding:0 22px 4px;}\n.h-card{flex-shrink:0;width:195px;background:var(--glass);border:1px solid var(--line);border-radius:18px;overflow:hidden;}\n.h-card .h-img{height:110px;position:relative;}\n.h-card .h-body{padding:12px 14px 14px;}\n.h-card .h-body .ttl{font-size:13px;font-weight:600;color:#fff;line-height:1.3;letter-spacing:-.005em;}\n.h-card .h-body .when{font-size:10.5px;color:var(--text-3);font-family:var(--mono);margin-top:6px;letter-spacing:.04em;}\n.h-card .h-body .row{display:flex;align-it ont-family:var(--mono);font-size:11.5px;}\n\n/* horizontal phone row */\n.phones-row{display:flex;gap:24px;align-items:flex-start;overflow-x:auto;padding:4px 4px 18px;scroll-snap-type:x mandatory;}\n.phones-row > .phone-block{scroll-snap-align:start;}\n.phone-block{flex-shrink:0;display:flex;flex-direction:column;align-items:center;width:330px;}\n.phone-block .phone{margin:0;}\n\n/* print */\n@page{size:A4 portrait;margin:12mm 10mm;}\n@media print {\n  html,body{background:var(--page-bg) !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact;}\n  .wrap{max-width:none;padding:0 4mm;}\n  .doc{padding:0;}\n  .topbar{position:static;background:var(--page-bg);}\n  .topbar .wrap{height:auto;padding:8px 0;}\n  .hero{box-shadow:none;margin-top:0;padding:38px 42px;break-after:page;page-break-after:always;}\n  .hero::before,.hero::after{display:none;}\n  section{margin-top:0;padding-top:18px;break-before:page;page-break-before:always;}\n  .sec-head{margin-bottom:8px;}\n  .lead{margin-bottom:22px;}\n  .stage{flex-wrap:wrap;gap:24px;}\n  .col-notes{max-width:none;flex:1 1 100%;}\n  .col-notes.notes[style*=\"grid\"]{display:grid !important;grid-template-columns:1fr 1fr !important;gap:14px 24px !important;}\n  .phones-row{flex-wrap:wrap;overflow:visible;gap:18px 22px;padding:0;justify-content:flex-start;}\n  .flow-arrow{display:none;}\n  .phone-block{break-inside:avoid;page-break-inside:avoid;width:auto;}\n  .phone{width:290px;padding:8px;border-radius:38px;box-shadow:0 4px 14px rgba(0,0,0,.5);break-inside:avoid;page-break-inside:avoid;}\n  .phone .screen{min-height:620px;border-radius:30px;}\n  .note,.h-card,.mini-tk,.tier-edit,.publish-card,.pay-card,.att-card,.tier-row,.tier-pick .tier{break-inside:avoid;page-break-inside:avoid;}\n  footer{margin-top:30px;break-before:page;page-break-before:always;border-top:none;padding-top:80px;}\n}\n@media (max-width:900px){\n  .stage{flex-direction:column;align-items:center;}\n  .col-notes{max-width:none;}\ ategories sit in the dark glass style.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div class=\"note\"><div class=\"bub\">F<\u002Fdiv><div><h4>Your tickets sit on the discover screen<\u002Fh4><p>If you have upcoming tickets, they live <em>on<\u002Fem> the Events tab — not buried in Wallet. The date stub mirrors the Chapaa visual rhythm (rounded rect, bold day + mono month).<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ FLOW 2 · EVENT DETAILS ============ -->\n<section data-screen-label=\"02 Event details\">\n  <div class=\"sec-head\"><span class=\"sec-num\">02<\u002Fspan><h2>Event details<\u002Fh2><\u002Fdiv>\n  <p class=\"lead\">Tap a featured card → full event page. Hero gallery, the four facts that matter (date, where, tiers, going), the host, \"about\" copy, then a tier list. The sticky bottom bar holds the price and the only primary action — <em>Get tickets<\u002Fem> — and adapts as the user selects.<\u002Fp>\n\n  <div class=\"stage\">\n    <div class=\"phone\">\n      <div class=\"island\"><\u002Fdiv>\n      <div class=\"screen\">\n        <div class=\"sb\"><span>9:41<\u002Fspan><div class=\"right\"><span class=\"sig\"><\u002Fspan><span class=\"wifi\"><\u002Fspan><span class=\"bat\"><span><\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv>\n\n        <div class=\"detail-hero cover navy\">\n          <span class=\"ph-label\">Cover · gallery 1/4<\u002Fspan>\n          <span class=\"ph-emoji\">🏃‍♀️<\u002Fspan>\n          <span class=\"glow\"><\u002Fspan>\n          <div class=\"back-btn\">‹<\u002Fdiv>\n          <div class=\"share-btn\">↗<\u002Fdiv>\n          <div class=\"dots\"><span class=\"on\"><\u002Fspan><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"detail-body\">\n          <div>\n            <div class=\"kicker\">Run for a cause · Season 5<\u002Fdiv>\n            <div class=\"detail-title\">JCH Marathon<br>2026<\u002Fdiv>\n          <\u002Fdiv>\n\n  name, when, where.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"flow-arrow\">›<\u002Fdiv>\n\n    <!-- 4.2 TIERS -->\n    <div class=\"phone-block\">\n      <div class=\"phone\">\n        <div class=\"island\"><\u002Fdiv>\n        <div class=\"screen\">\n          <div class=\"sb\"><span>9:42<\u002Fspan><div class=\"right\"><span class=\"sig\"><\u002Fspan><span class=\"wifi\"><\u002Fspan><span class=\"bat\"><span><\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <div class=\"create-head\">\n            <div class=\"top\"><span class=\"x\" style=\"font-size:18px;\">‹<\u002Fspan><span class=\"save-d\">Save draft<\u002Fspan><\u002Fdiv>\n            <div class=\"h\">Ticket tiers<\u002Fdiv>\n            <div class=\"sub\">Step 2 of 3 · Name + price each option<\u002Fdiv>\n            <div class=\"step-rail\"><div class=\"seg done\"><\u002Fdiv><div class=\"seg on\"><\u002Fdiv><div class=\"seg\"><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"create-body\">\n            <div class=\"tier-edit\">\n              <div class=\"te-head\"><span class=\"nm\"><span class=\"num\">1<\u002Fspan> Fun-run tier<\u002Fspan><span class=\"del\">🗑 Remove<\u002Fspan><\u002Fdiv>\n              <div class=\"inp-mini\" style=\"font-weight:600;\">5KM Fun Run<\u002Fdiv>\n              <div class=\"grid\">\n                <div class=\"inp-affix\"><span class=\"pre\">TZS<\u002Fspan><span class=\"val\">25,000<\u002Fspan><\u002Fdiv>\n                <div class=\"inp-affix\"><span class=\"val\">500<\u002Fspan><span class=\"post\">cap<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"tier-edit\">\n              <div class=\"te-head\"><span class=\"nm\"><span class=\"num\">2<\u002Fspan> Competitive tier<\u002Fspan><span class=\"del\">🗑 Remove<\u002Fspan><\u002Fdiv>\n              <div class=\"inp-mini\" style=\"font-weight:600;\">10KM Race<\u002Fdiv>\n              <div class=\"grid\">\n                <div class=\"inp-affix\"><span class=\"pre\">TZS<\u002Fspan><span class=\"val\">30,000<\u002Fspan><\u002Fdiv>\n                <div class=\"inp-affix\"><span class=\"val\">300<\u002Fspan><span class=\"post\">cap<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"tier-edit\">\n              <div class=\"te-head\"><span class=\"nm\"><span class=\"num\">3<\u002Fspan> Half marathon<\u002Fspan><span class=\"del\">🗑 Remove<\u002Fspan><\u002Fdiv>\n              <div class=\"inp-mini\" style=\"font-weight:600;\">21KM Half Marathon<\u002Fdiv>\n              <div class=\"grid\">\n                <div class=\"inp-affix\"><span class=\"pre\">TZS<\u002Fspan><span class=\"val\">50,000<\u002Fspan><\u002Fdiv>\n                <div class=\"inp-affix\"><span class=\"val\">100<\u002Fspan><span class=\"post\">cap<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <button class=\"add-tier\">＋ Add another tier<\u002Fbutton>\n            <div style=\"background:var(--mint-soft);border:1px solid var(--mint-border);border-radius:13px;padding:12px 14px;display:flex;gap:10px;font-size:11.5px;color:var(--mint-bright);line-height:1.5;font-weight:300;\">\n              <span style=\"font-size:14px;\">💡<\u002Fspan>\n              <span>Leave <b style=\"color:#fff;font-weight:600;\">cap<\u002Fb> blank for unlimited tickets. You can edit prices later — sold tickets keep their original price.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"sticky-bar\">\n            <div><div class=\"info\">3 tiers · 900 max<\u002Fdiv><\u002Fdiv>\n            <button class=\"btn-go\">Next · review →<\u002Fbutton>\n          <\u002Fdiv>\n          <div class=\"home-ind\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"label\"><div class=\"num\">4.2<\u002Fdiv><div class=\"nm\">Ticket tiers<\u002Fdiv><div class=\"desc\">Each tier = name + price + optional cap.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"flow-arrow\">›<\u002Fdiv>\n\n    <!-- 4.3 PUBLISH -->\n    <div class=\"phone-block\">\n      <div class=\"phone\">\n        <div class=\"island\"><\u002Fdiv>\n        <div class=\"screen\">\n          <div class=\"sb\"><span>9:42<\u002Fspan><div class=\"right\"><span class=\"sig\"><\u002Fspan><span class=\"wifi\"><\u002Fspan><span class=\"bat\"><span><\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <div class=\"create-head\">\n            <div class=\"top\"><span class=\"x\" style=\"font-size:18px;\">‹<\u002Fspan><span class=\"save-d\">Edit<\u002Fspan><\u002Fdiv>\n            <div class=\"h\">You're live<\u002Fdiv>\n            <div class=\"sub\">Step 3 of 3 · Share your link<\u002Fdiv>\n            <div class=\"step-rail\"><div class=\"seg done\"><\u002Fdiv><div class=\"seg done\"><\u002Fdiv><div class=\"seg on\"><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"create-body\">\n            <div class=\"publish-card\">\n              <div class=\"check\">✓<\u002Fdiv>\n              <div class=\"h\">JCH Marathon 2026<\u002Fdiv>\n              <div class=\"s\">Sat 18 Jul · 3 tiers · 900 tickets<\u002Fdiv>\n              <div class=\"link\">\n                <span style=\"color:rgba(10,40,28,.65);\">🔗<\u002Fspan>\n                <span class=\"lk\">chapaa.app/c/jch-marathon-26<\u002Fspan>\n                <span class=\"copy\">COPY<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"share-stats\">\n              <div class=\"cell\"><div class=\"k\">Tiers<\u002Fdiv><div class=\"v\">3<\u002Fdiv><\u002Fdiv>\n              <div class=\"cell\"><div class=\"k\">Capacity<\u002Fdiv><div class=\"v\">900<\u002Fdiv><\u002Fdiv>\n              <div class=\"cell\"><div class=\"k\">Lowest<\u002Fdiv><div class=\"v\">25k<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"publish-actions\">\n              <button class=\"share\">💬 Share to WhatsApp<\u002Fbutton>\n              <button class=\"qr-btn\">⊞ Download QR poster<\u002Fbutton>\n              <button class=\"done\">Go to dashboard<\u002Fbutton>\n            <\u002Fdiv>\n\n            <div style=\"background:var(--glass);border:1px solid var(--line);border-radius:13px;padding:13px 15px;font-size:11.5px;color:var(--text-2);line-height:1.55;font-weight:300;\">\n              <span style=\"font-size:13px;font-weight:600;color:#fff;display:block;margin-bottom:4px;\">What happens next<\u002Fspan>\n              Every purchase issues codes via WhatsApp + SMS. You'll see buyers, codes and check-ins in your dashboard. Open the scan tab to verify tickets at the gate.\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"home-ind\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"label\"><div class=\"num\">4.3<\u002Fdiv><div class=\"nm\">Publish &amp; share<\u002Fdiv><div class=\"desc\">Public link + WhatsApp share + QR poster.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"stage\" style=\"margin-top:36px;\">\n    <div class=\"col-notes notes\" style=\"max-width:none;display:grid;grid-template-columns:1fr 1fr;gap:18px 30px;\">\n      <div class=\"note\"><div class=\"bub\">A<\u002Fdiv><div><h4>Three steps, not a long form<\u002Fh4><p>Basics → tiers → publish. Each step fits one screen on most phones. \"Save draft\" exits without losing progress at any point.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div class=\"note\"><div class=\"bub\">B<\u002Fdiv><div><h4>Cover is the first input<\u002Fh4><p>Photos sell the event. The dropzone accepts up to 6 images — first is the hero, the rest are gallery slides on the detail page.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div class=\"note\"><div class=\"bub\">C<\u002Fdiv><div><h4>Tier rows are atomic<\u002Fh4><p>Name + price + optional cap. Drag-and-drop to reorder. Mistakes are cheap because everything except <code>price_paid<\u002Fcode> on sold tickets stays editable.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div class=\"note\"><div class=\"bub\">D<\u002Fdiv><div><h4>Publish is its own celebration<\u002Fh4><p>Step 3 isn't a \"submit\" — it's the share screen. Link is presented prominently in the saturated mint card. WhatsApp share is the primary action.<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer>\n  <p class=\"mono\">chapaa · ticketing redesign · dark · prepared for PDF review<\u002Fp>\n  <p>Events tab · Event details · Purchase flow · Create-event flow · 14 screens total<\u002Fp>\n<\u002Ffooter>\n\n<\u002Fdiv>\n\n\n\n<\u002Fbody><\u002Fhtml>"
